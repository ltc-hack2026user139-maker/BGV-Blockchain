steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA'
      - '.'

  # Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '5000'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - >
        FLASK_ENV=production,
        GEMINI_MODEL=gemini-2.5-flash,
        GOOGLE_CLOUD_PROJECT=ltc-hack2026-team28,
        GOOGLE_CLOUD_LOCATION=global,
        FABRIC_SAMPLES_PATH=/home/ltc_hack2026user136/fabric-samples,
        FABRIC_GATEWAY_PEER=34.72.224.210:7051,
        FABRIC_MSP_ID=Org1MSP,
        FABRIC_MSP_CONFIG_PATH=/home/ltc_hack2026user136/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp,
        FABRIC_TLS_CERT_PATH=/home/ltc_hack2026user136/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/tlsca/tlsca.org1.example.com-cert.pem,
        FABRIC_PEER2_ADDRESS=34.72.224.210:9051,
        FABRIC_PEER2_TLS_CERT=/home/ltc_hack2026user136/fabric-samples/test-network/organizations/peerOrganizations/org2.example.com/tlsca/tlsca.org2.example.com-cert.pem,
        FABRIC_ORDERER_ADDRESS=34.72.224.210:7050,
        FABRIC_ORDERER_TLS_CERT=/home/ltc_hack2026user136/fabric-samples/test-network/organizations/ordererOrganizations/example.com/orderers/orderer.example.com/msp/tlscacerts/tlsca.example.com-cert.pem,
        FABRIC_CFG_PATH=/home/ltc_hack2026user136/fabric-samples/config,
        FABRIC_BIN_PATH=/home/ltc_hack2026user136/fabric-samples/bin,
        FABRIC_CHANNEL=bgvchannel,
        FABRIC_CHAINCODE=bgv,
        BGV_LEDGER_PATH=bgv_ledger.ndjson

substitutions:
  _REGION: 'us-central1'
  _ARTIFACT_REPOSITORY: 'bgv-repo'
  _SERVICE_NAME: 'bgv-document-verification'

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
